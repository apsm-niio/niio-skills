name: Windows 專案遷移防護（實際連結）
on:
  workflow_dispatch:
  pull_request:
    paths: ['skills/mcp/niio-mcp-app-builder/scripts/project_files.py', 'tests/test_project_files.py', '.github/workflows/windows-project-files.yml']
  push:
    branches: [main]
    paths: ['skills/mcp/niio-mcp-app-builder/scripts/project_files.py', 'tests/test_project_files.py', '.github/workflows/windows-project-files.yml']
permissions:
  contents: read
jobs:
  windows-links:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 實際建立連結並驗證原檔、備份、中斷續跑及拒絕符號連結
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p test_project_files.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
