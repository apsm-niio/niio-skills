name: 固定來源整合驗證（無 niio 操作）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['skills/**', 'scripts/**', 'localization/**', 'tests/**', 'assets/**', 'requirements-validation.txt', 'README.md', '.gitattributes', '.github/workflows/**']
  pull_request:
    paths: ['skills/**', 'scripts/**', 'localization/**', 'tests/**', 'assets/**', 'requirements-validation.txt', 'README.md', '.gitattributes', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pip install -r requirements-validation.txt
      - name: 取得已固定上游快照
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python -c 'import json; print(json.load(open("localization/upstream-state.json"))["upstreamCommit"])')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags https://github.com/mingdaocom/hap-skills.git "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          mkdir "$RUNNER_TEMP/niio-upstream"
          git archive "$sha" | tar -x -C "$RUNNER_TEMP/niio-upstream"
      - run: python scripts/validate_release.py --upstream-source "$RUNNER_TEMP/niio-upstream"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: node --test tests/test_website_gateway.mjs
